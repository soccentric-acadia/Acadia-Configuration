syntax = "proto3";
package instr.common;
message ControlRequest { string daemon = 1; string op = 2; string json_args = 3; string actor = 4; uint64 request_id = 5; uint32 deadline_ms = 6; }
message ControlReply { uint64 request_id = 1; bool ok = 2; string code = 3; string message = 4; string json_payload = 5; string actor = 6; }
message Heartbeat { string peer = 1; uint64 sequence = 2; uint64 mono_ns = 3; string boot_id = 4; bool ready = 5; uint32 health = 6; string detail = 7; }
message HeartbeatAck { uint64 sequence = 1; uint64 mono_ns = 2; }
message PeerStatus { string peer = 1; uint32 kind = 2; bool connected = 3; bool operational = 4; uint64 last_sequence = 5; uint64 last_mono_ns = 6; string state = 7; string detail = 8; }
message PeerStatusList { repeated PeerStatus peers = 1; }
