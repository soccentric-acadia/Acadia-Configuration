# SoCcentric WebConfig — Yocto layer (spec §5 named this meta-soccentric-
# webconfig; the on-disk directory is meta-webconfig — docs updated to match).
#
# Adds the on-device WebConfig daemon, its static frontend, schema files, and
# per-platform board manifest to any Yocto image. All OS customization lives in
# this meta layer — upstream Yocto/BSP layers are never patched (global §1).
#
# Add to your image via:
#   IMAGE_INSTALL:append = " webconfigd webconfig-static webconfig-schemas"
# and ship a platform board-manifest (see webconfig-manifest recipe / hook).

# We only append; this layer never overrides core/BSP classes.
BBPATH .= ":${LAYERDIR}"

BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

# This layer depends on the core + rust/cargo classes. `cargo.bbclass` and the
# `cargo`/`rust` recipes live in oe-core since scarthgap, BUT oe-core Scarthgap
# ships Rust 1.75.0 (Yocto 5.0 release note) which is too old to build webconfigd:
# its Cargo.lock is v4 format (cargo >= 1.78) and the locked dependency tree
# (icu_*/idna_adapter edition-2024 crates) needs rustc >= 1.86.
#
# So on Scarthgap this layer must be built against a newer Rust toolchain provided
# by the official mixin layer `meta-lts-mixins`, branch `scarthgap/rust` (it tracks
# oe-core master and currently ships rust 1.87 / RUSTVERSION 1.87.0%). That is the
# supported path for "current Rust in an LTS"; do NOT use oe-core's default rust.
#
#   # add the rust mixin layer to your bblayers.conf (collections: scarthgap-rust-mixin)
#   BBLAYERS += "${TOPDIR}/../meta-lts-mixins/rust"
#
# With that mixin present, its `cargo.bbclass` and `rust` recipes override
# oe-core's, so the `inherit cargo` recipes here cross-compile against 1.87 for
# the Raspberry Pi 5 (aarch64) target.
LAYERSERIES_COMPAT_soccentric-webconfig = "scarthgap styhead walnutar"

LAYERDEPENDS_soccentric-webconfig = "core"
# Scarthgap: require the newer-Rust mixin (oe-core's 1.75 cannot build webconfigd).
# Only when the image's rust is older than 1.86 (i.e. plain Scarthgap/oe-core).
LAYERDEPENDS_soccentric-webconfig:scarthgap = "core scarthgap-rust-mixin"

# WebConfig ships for these machines by default (spec §3: 6 platforms). Other
# machines must provide a board-manifest via the webconfig-manifest bbappend.
LAYERSERIES_COREVERSION_soccentric-webconfig = "14"