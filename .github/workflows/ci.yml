# SoCcentric WebConfig CI (spec §6: build all three cross-targets on every commit).
name: webconfig-ci

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  CARGO_TERM_COLOR: always

jobs:
  host-test:
    name: Build, test, lint (x86_64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.97.1"
          components: rustfmt, clippy
      - name: Install cross linkers
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu gcc-arm-linux-gnueabihf
      - name: Format check
        run: make fmt
      - name: Canonical validation contract (build && test && lint)
        run: make check
      - name: Release checksum gate (task 28)
        run: make lint-checksums
      # CFG-034: the wiring gate used to be skipped in CI (`|| echo skipped`)
      # because meta-acadia was never checked out. It is a separate private
      # repository; META_ACADIA_READ_TOKEN is a read-only token for it.
      - name: Check out meta-acadia (image recipe)
        uses: actions/checkout@v4
        with:
          repository: soccentric-acadia/meta-acadia
          ref: develop
          path: .ci/meta-acadia
          token: ${{ secrets.META_ACADIA_READ_TOKEN }}
      - name: OS image wiring gate (task 26/27)
        run: make lint-image-wiring META_ACADIA_DIR=.ci/meta-acadia
      - name: Lint
        run: make lint
      - name: Test (fake sysroot, no hardware)
        run: make test
      - name: Build
        run: make build

  cross-build:
    name: Cross-build ${{ matrix.target }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - aarch64-unknown-linux-gnu
          - armv7-unknown-linux-gnueabihf
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.97.1"
          targets: ${{ matrix.target }}
      - name: Install cross linker
        run: |
          sudo apt-get update
          case "${{ matrix.target }}" in
            aarch64-unknown-linux-gnu) sudo apt-get install -y gcc-aarch64-linux-gnu ;;
            armv7-unknown-linux-gnueabihf) sudo apt-get install -y gcc-arm-linux-gnueabihf ;;
          esac
      - name: Release build
        run: cargo build --workspace --release --target ${{ matrix.target }}
      - name: Binary size budget (3–6 MB)
        run: |
          BIN="target/${{ matrix.target }}/release/webconfigd"
          BYTES=$(stat -c %s "$BIN")
          echo "webconfigd size: $((BYTES/1024)) KB"
          # Spec §2 target is 3–6 MB; warn (not fail) at first while we tune opt flags.
          if [ "$((BYTES/1024))" -gt 6144 ]; then echo "::warning::binary exceeds 6 MB budget"; fi